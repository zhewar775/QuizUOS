<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پانێڵی بەڕێوەبەری وۆرکشۆپ (ئادمین)</title>
    <!-- بانگکردنی فۆنتی ڕووداو (Rudaw) -->
    <style>
        @font-face {
            font-family: 'Rudaw';
            src: url('https://raw.githubusercontent.com/Fons-Kurdi/Rudaw/main/RudawRegular.ttf') format('truetype');
        }

        body {
            font-family: 'Rudaw', Tahoma, sans-serif;
            background: linear-gradient(rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.95)), 
                        url('https://images.unsplash.com/photo-1541888946425-d0fbb18f154d?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .admin-panel {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(16px);
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h2 {
            color: #38bdf8;
            margin-bottom: 5px;
            text-align: center;
        }

        button {
            padding: 12px 20px;
            margin: 6px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
            font-family: 'Rudaw', Tahoma, sans-serif;
            cursor: pointer;
            font-weight: bold;
            background: #0284c7;
            color: white;
            transition: 0.3s;
        }

        button:hover {
            background: #0369a1;
            transform: translateY(-2px);
        }

        .btn-green { background: #059669; }
        .btn-green:hover { background: #047857; }
        .danger { background: #dc2626; }
        .danger:hover { background: #b91c1c; }

        .leaderboard {
            margin-top: 25px;
            background: rgba(15, 23, 42, 0.7);
            padding: 20px;
            border-radius: 10px;
            text-align: right;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .admin-opt {
            padding: 12px;
            margin: 8px 0;
            background: rgba(71, 85, 105, 0.6);
            border-radius: 8px;
            text-align: right;
            font-size: 15px;
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body>

    <div class="admin-panel">
        <h2>پانێڵی بەڕێوەبەری کویز</h2>
        <p style="text-align: center; color: #94a3b8; font-size: 14px;">دۆخی ئێستا: <span id="admin-status" style="color: #fbbf24; font-weight: bold;">ئامادە بۆ بەڕێوەبردن</span></p>
        <h3 id="active-q-title" style="color: #38bdf8; margin: 20px 0; text-align: center; font-size: 18px;">هیچ پرسیارێک نیشان نەدراوە</h3>
        
        <hr style="border: 0; border-top: 1px solid #475569; margin: 20px 0;">
        
        <div style="text-align: center;">
            <button onclick="setQuestion(0)">نیشاندانی پرسیاری ١</button>
            <button onclick="setQuestion(1)">نیشاندانی پرسیاری ٢</button>
            <button onclick="setQuestion(2)">نیشاندانی پرسیاری ٣</button>
        </div>
        
        <div style="margin-top: 15px; text-align: center;">
            <button class="btn-green" onclick="revealResults()">📢 ڕاگەیاندنی ئەنجام بۆ هۆڵەکە</button>
            <button class="danger" onclick="stopQuiz()">سفرکردنەوەی سیستەم</button>
        </div>

        <div class="leaderboard">
            <h4 style="margin-top: 0; color: #38bdf8;">چاودێری ڕاستەوخۆی وەڵامی زانکۆکان:</h4>
            <div id="admin-options-view" style="color: #e2e8f0;">هیچ پرسیارێک کارا نییە...</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBX7jCnarT2n8fQCLUTvFbmd0xP6C_hbRU",
            authDomain: "quizuos.firebaseapp.com",
            databaseURL: "https://quizuos-default-rtdb.firebaseio.com",
            projectId: "quizuos",
            storageBucket: "quizuos.appspot.com",
            messagingSenderId: "301015950450",
            appId: "1:301015950450:web:952648f2018e1cd9bfceeb",
            measurementId: "G-JW5HZZ82J4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const questionsList = [
            "پرسیاری ١: بەهێزترین پێکهاتە لە کۆنکرێتدا بۆ بەرنگاربوونەوەی هێزی کێشان (Tension) کامەیە؟",
            "پرسیاری ٢: کام لەم ئامرازانە بۆ دیاریکردنی ئاستی ڕووی زەوی و بەرزی و نزمایی لە مەیداندا بەکاردێت؟",
            "پرسیاری ٣: لە نەخشەی ئەندازیاریدا (AutoCAD)، هێماکان بە چ یەکەیەک بە شێوەیەکی باو دەپێورێن؟"
        ];

        const optionsList = [
            ["سیمکۆنکرێت", "ئاسنی بنیادنان (Rebar)", "خەڵووز", "قوڕ"],
            ["تۆتاڵ ستەیشن", "لیڤڵ (Level)", "کۆمپاس", "تەپڵە"],
            ["متر یان سانتی‌یمتر", "کیلۆگرام", "لیتەر", "وات"]
        ];

        const correctAnswers = [1, 1, 0];

        function setQuestion(index) {
            db.ref('currentQuestion').set(index);
            db.ref('showResults').set(false);
            db.ref('submissions').remove();
            
            document.getElementById('admin-status').innerText = "پرسیاری " + (index + 1) + " نیشان درا";
            document.getElementById('active-q-title').innerText = questionsList[index];
            document.getElementById('admin-status').style.color = "#059669";
            renderAdminView(index, {});
        }

        function revealResults() {
            db.ref('showResults').set(true);
            document.getElementById('admin-status').innerText = "ئەنجام ڕاگەیەندرا بۆ هۆڵەکە!";
            document.getElementById('admin-status').style.color = "#38bdf8";
        }

        function stopQuiz() {
            db.ref('currentQuestion').remove();
            db.ref('showResults').remove();
            db.ref('submissions').remove();
            document.getElementById('admin-status').innerText = "سیستەمەکە سفرکرایەوە!";
            document.getElementById('active-q-title').innerText = "هیچ پرسیارێک نیشان نەدراوە";
            document.getElementById('admin-options-view').innerHTML = "هیچ پرسیارێک کارا نییە...";
            document.getElementById('admin-status').style.color = "#dc2626";
        }

        db.ref('submissions').on('value', (snapshot) => {
            const data = snapshot.val() || {};
            db.ref('currentQuestion').once('value', (qSnap) => {
                let qIdx = qSnap.val();
                if(qIdx !== null && qIdx !== undefined) {
                    renderAdminView(qIdx, data);
                }
            });
        });

        function renderAdminView(qIdx, submissions) {
            let opts = optionsList[qIdx];
            let correctIdx = correctAnswers[qIdx];
            let html = "";

            opts.forEach((opt, idx) => {
                let voters = [];
                for(let key in submissions) {
                    if(submissions[key].answerIndex === idx) {
                        voters.push(submissions[key].uniName);
                    }
                }

                let style = "background: rgba(71, 85, 105, 0.6);";
                if(idx === correctIdx) style = "background: rgba(5, 150, 105, 0.4); border: 1px solid #10b981;";

                html += `<div class="admin-opt" style="${style}">
                    <strong>${idx + 1}. ${opt}</strong> ${idx === correctIdx ? ' ⭐ (وەڵامی ڕاست)' : ''}<br>
                    <span style="font-size: 13px; color: #38bdf8;">بەشداربووان: ${voters.length > 0 ? voters.join(', ') : 'هیچ'}</span>
                </div>`;
            });

            document.getElementById('admin-options-view').innerHTML = html;
        }
    </script>
</body>
</html>

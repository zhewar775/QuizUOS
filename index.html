<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کویزی زانکۆکان - بەشداربوو</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 20px; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; max-width: 480px; margin: 30px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: none; font-size: 16px; box-sizing: border-box; }
        input { background: #334155; color: #fff; }
        button { background: #3b82f6; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #2563eb; }
        .option-container-box { position: relative; margin: 10px 0; }
        .option-btn { display: block; width: 100%; padding: 12px; background: #334155; color: white; border: none; border-radius: 6px; cursor: pointer; text-align: right; font-size: 16px; transition: 0.2s; }
        .option-btn:hover { background: #475569; }
        .option-btn.selected { background: #3b82f6 !important; border: 2px solid #fff; }
        .option-btn.correct { background: #10b981 !important; color: white; } 
        .option-btn.wrong { background: #ef4444 !important; color: white; }   
        .voter-tag { font-size: 12px; color: #38bdf8; margin-top: 4px; text-align: right; padding-right: 5px; font-weight: bold; }
        #timer { font-size: 20px; color: #ef4444; font-weight: bold; margin-bottom: 15px; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body>

    <div id="login-section" class="card">
        <h2>چوونەژوورەوە بۆ کویز</h2>
        <input type="text" id="uni-name" placeholder="ناوی زانکۆکەت (بنموونە: زانکۆی سلێمانی)">
        <input type="password" id="room-password" placeholder="پاسۆردی ژوور (workshop2026)">
        <button onclick="joinQuiz()">بەشداریکردن</button>
    </div>

    <div id="quiz-section" class="card" style="display: none;">
        <div id="timer">کات: --</div>
        <h3 id="question-title">چاوەڕێکن تا ئادمین پرسیار دەستپێدەکات...</h3>
        <div id="options-container"></div>
        <p id="status-msg" style="font-size: 16px; color: #f59e0b; margin-top: 15px; font-weight: bold;"></p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBX7jCnarT2n8fQCLUTvFbmd0xP6C_hbRU",
            authDomain: "quizuos.firebaseapp.com",
            databaseURL: "https://quizuos-default-rtdb.firebaseio.com",
            projectId: "quizuos",
            storageBucket: "quizuos.appspot.com",
            messagingSenderId: "301015950450",
            appId: "1:301015950450:web:952648f2018e1cd9bfceeb",
            measurementId: "G-JW5HZZ82J4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const questions = [
            {
                title: "پرسیاری ١: بەهێزترین پێکهاتە لە کۆنکرێتدا بۆ بەرنگاربوونەوەی هێزی کێشان (Tension) کامەیە؟",
                options: ["سیمکۆنکرێت", "ئاسنی بنیادنان (Rebar)", "خەڵووز", "قوڕ"],
                answer: 1
            },
            {
                title: "پرسیاری ٢: کام لەم ئامرازانە بۆ دیاریکردنی ئاستی ڕووی زەوی و بەرزی و نزمایی لە مەیداندا بەکاردێت؟",
                options: ["تۆتاڵ ستەیشن", "لیڤڵ (Level)", "کۆمپاس", "تەپڵە"],
                answer: 1
            },
            {
                title: "پرسیاری ٣: لە نەخشەی ئەندازیاریدا (AutoCAD)، هێماکان بە چ یەکەیەک بە شێوەیەکی باو دەپێورێن؟",
                options: ["متر یان سانتی‌یمتر", "کیلۆگرام", "لیتەر", "وات"],
                answer: 0
            }
        ];

        let currentUniName = "";
        let timerInterval = null;
        let isTimeUp = false;
        let activeQIndex = null;
        let selectedOptionIndex = null;

        function joinQuiz() {
            const uni = document.getElementById('uni-name').value;
            const pass = document.getElementById('room-password').value;
            
            if(pass === "workshop2026" && uni.trim() !== "") {
                currentUniName = uni.trim();
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('quiz-section').style.display = 'block';
                listenToAdminActions();
            } else {
                alert("پاسۆرد یان ناوی زانکۆ هەڵەیە!");
            }
        }

        function listenToAdminActions() {
            // گوێگرتن لە گۆڕانی پرسیار
            db.ref('currentQuestion').on('value', (snapshot) => {
                const qIndex = snapshot.val();
                if(qIndex === null || qIndex === undefined || questions[qIndex] === undefined) {
                    document.getElementById('question-title').innerText = "چاوەڕێکن تا ئادمین پرسیار دەستپێدەکات...";
                    document.getElementById('options-container').innerHTML = "";
                    document.getElementById('status-msg').innerText = "";
                    document.getElementById('timer').innerText = "کات: --";
                    if(timerInterval) clearInterval(timerInterval);
                    activeQIndex = null;
                } else {
                    if(activeQIndex !== qIndex) {
                        activeQIndex = qIndex;
                        selectedOptionIndex = null;
                        loadQuestionForUser(qIndex);
                    }
                }
            });

            // گوێگرتن بۆ کاتێک ئادمین ئەنجام ڕادەگەیەنێت
            db.ref('showResults').on('value', (snapshot) => {
                if(snapshot.val() === true && activeQIndex !== null) {
                    showFinalResults();
                }
            });
        }

        function loadQuestionForUser(qIndex) {
            const q = questions[qIndex];
            document.getElementById('question-title').innerText = q.title;
            let container = document.getElementById('options-container');
            container.innerHTML = "";
            document.getElementById('status-msg').innerText = "";
            isTimeUp = false;
            
            q.options.forEach((opt, idx) => {
                let box = document.createElement('div');
                box.className = "option-container-box";

                let btn = document.createElement('button');
                btn.className = "option-btn";
                btn.id = "opt-btn-" + idx;
                btn.innerText = opt;
                
                btn.onclick = function() {
                    if(isTimeUp) return; // ئەگەر کات تەواو بووبێت ناگۆڕدرێت
                    
                    let allBtns = container.querySelectorAll('.option-btn');
                    allBtns.forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedOptionIndex = idx;
                    
                    // نوێکردنەوەی وەڵام لە فایەربەیس لە ماوەی کاتەکەدا
                    db.ref('submissions/' + currentUniName.replace(/[.#$\/\[\]]/g, '_')).set({
                        uniName: currentUniName,
                        answerIndex: idx,
                        isCorrect: (idx === q.answer)
                    });
                    
                    document.getElementById('status-msg').innerText = "وەڵامەکەت هەڵبژێردرا (دەتوانیت تا تەواوبوونی کات بیگۆڕیت)";
                };

                let tagDiv = document.createElement('div');
                tagDiv.className = "voter-tag";
                tagDiv.id = "voter-tag-" + idx;

                box.appendChild(btn);
                box.appendChild(tagDiv);
                container.appendChild(box);
            });

            // سیستەمی ٦٠ چرکە
            if(timerInterval) clearInterval(timerInterval);
            let timeLeft = 60;
            document.getElementById('timer').innerText = "کاتی ماوە: " + timeLeft + " چرکە";
            
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = "کاتی ماوە: " + timeLeft + " چرکە";
                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    isTimeUp = true;
                    document.getElementById('timer').innerText = "کاتەکە تەواو بوو! وەڵامدانەوە قفڵ بوو.";
                    document.getElementById('status-msg').innerText = "چاوەڕێی ڕاگەیاندنی ئەنجام لەلایەن ئادمینەوە...";
                }
            }, 1000);
        }

        function showFinalResults() {
            if(timerInterval) clearInterval(timerInterval);
            isTimeUp = true;
            document.getElementById('timer').innerText = "ئەنجامی پرسیار ڕاگەیەندرا!";
            
            const q = questions[activeQIndex];

            // خوێندنەوەی گشت وەڵامەکانی بەشداربووان بۆ نیشاندانی لەسەر هەموو مۆبایلەکان
            db.ref('submissions').once('value', (snapshot) => {
                let submissions = snapshot.val() || {};
                
                // ڕێکخستنی ناوەکان لەپاڵ هەڵبژاردنەکاندا
                for(let i = 0; i < q.options.length; i++) {
                    let btn = document.getElementById('opt-btn-' + i);
                    let tag = document.getElementById('voter-tag-' + i);
                    tag.innerHTML = "";

                    // ڕەنگکردنی ڕاست و هەڵە
                    if(i === q.answer) {
                        btn.classList.add('correct'); // سەوز بۆ وەڵامی ڕاست
                    } else if(selectedOptionIndex === i) {
                        btn.classList.add('wrong');   // سوور ئەگەر بەشداربوو ئەمەی هەڵبژاردبێت و هەڵە بێت
                    }

                    // کۆکردنەوەی ناوی ئەو زانکۆیانەی ئەم بژاردەیەیان هەڵبژاردووە
                    let voters = [];
                    for(let key in submissions) {
                        if(submissions[key].answerIndex === i) {
                            voters.push(submissions[key].uniName);
                        }
                    }

                    if(voters.length > 0) {
                        tag.innerHTML = "👤 وەڵامدەرەکان: " + voters.join(', ');
                    }
                }
            });
        }
    </script>
</body>
</html>
